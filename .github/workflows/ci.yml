name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK packages
        # The runner's bundled sdkmanager repository predates API 37 and can't resolve
        # platforms;android-37 or build-tools;37.0.0, so fetch both archives from Google's
        # SDK repo directly and unpack them where sdkmanager would.
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          install_sdk_pkg() {
            curl -fsSL "$1" -o "$RUNNER_TEMP/sdk-pkg.zip"
            rm -rf "$RUNNER_TEMP/sdk-pkg" && unzip -q "$RUNNER_TEMP/sdk-pkg.zip" -d "$RUNNER_TEMP/sdk-pkg"
            mkdir -p "$(dirname "$2")" && rm -rf "$2"
            mv "$(find "$RUNNER_TEMP/sdk-pkg" -mindepth 1 -maxdepth 1 -type d)" "$2"
          }
          install_sdk_pkg https://dl.google.com/android/repository/platform-37.0_r02.zip "$ANDROID_HOME/platforms/android-37"
          install_sdk_pkg https://dl.google.com/android/repository/build-tools_r37_linux.zip "$ANDROID_HOME/build-tools/37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install ffmpeg
        # The desktop H.264 decoder is an ffmpeg process, and the flags it drives one with were
        # arrived at empirically (see FfmpegH264DecoderTest). Its test skips itself where there is no
        # ffmpeg, so without this step a regression in those flags would go green here.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        # `allTests` as well as `test`: :shared and :composeApp are Kotlin Multiplatform modules
        # whose test tasks are named after their targets (desktopTest), so a bare `test` matched
        # nothing in them and only :server was ever tested here.
        #
        # Under xvfb-run because compose-resources asks AWT for the screen resolution when it loads
        # a string, which throws HeadlessException on a runner with no display — the failure lands
        # inside a coroutine and surfaces as a test that never reaches its final state.
        #
        # One Xvfb, fixed display, for the WHOLE step (including retries). Two traps with
        # xvfb-run --auto-servernum per attempt: (1) it may pick a different display number each
        # time while the Gradle daemon keeps the old DISPLAY env — test JVMs then can't reach the
        # display and every render/form test dies with ExceptionInInitializerError (X11GraphicsEnvironment);
        # (2) plain Xvfb has no GLX, so Skiko falls back to slow software X11 rendering — on a busy
        # runner the frame rate drops and render-timing tests (wait ≤120 frames for ANSI pixels)
        # plus input-driven form tests time out together. Enable GLX (+extension GLX) so Skiko uses
        # mesa llvmpipe, keep the screen modest (1280x1024 — software pixels cost time), and retry
        # up to 3 times ON THE SAME display: a repeat flake is near-impossible, while a real failure
        # (compile/test logic) fails every attempt.
        run: |
          set +e
          Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!
          export DISPLAY=:99
          code=0
          for attempt in 1 2 3; do
            ./gradlew test allTests --stacktrace
            code=$?
            if [ $code -eq 0 ]; then break; fi
            echo "test run $attempt failed (possibly the flaky xvfb render test); retrying on the same display"
            sleep 30
          done
          kill $XVFB_PID 2>/dev/null
          wait $XVFB_PID 2>/dev/null
          exit $code

      # Static analysis. Runs after the tests so a red suite is reported first — detekt findings are
      # cheaper to read once the behaviour is known good. Existing findings sit in
      # gradle/detekt-baseline-*.xml; this step fails only on NEW ones.
      - name: Detekt
        run: ./gradlew detektAll --stacktrace

      # Gradle prints only the assertion's file and line; the values it compared live in the report.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/detekt/
          retention-days: 7
